[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-learner"
version = "0.1.0"
description = "Turn any remote repo into an interactive HTML learning document using Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "PyGithub>=2.3",
    "gitpython>=3.1",
    "click>=8.1",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "rich>=13.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-recording>=0.13",
    "vcrpy>=6.0",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
repo-learn = "main:cli"

[tool.hatch.build.targets.wheel]
packages = ["agent", "output"]

[tool.pytest.ini_options]
addopts = "-ra -q"
markers = [
    "slow: marks tests requiring real API keys",
    "vcr: marks tests using cassette recordings",
    "default_cassette_name: set the cassette filename",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agent", "output"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
